# Replace chibi.example.com with your hostname and obtain its certificate first.
# Install nginx-content.conf at /etc/nginx/snippets/chibi-studio-content.conf.
server {
    listen 80;
    listen [::]:80;
    server_name chibi.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chibi-studio/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://chibi.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chibi.example.com;

    ssl_certificate /etc/letsencrypt/live/chibi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chibi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ChibiStudioSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/chibi-studio-access.log;
    error_log /var/log/nginx/chibi-studio-error.log;

    include /etc/nginx/snippets/chibi-studio-content.conf;
}
