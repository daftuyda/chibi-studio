# Shared by this site's HTTP bootstrap and HTTPS server blocks.
# The public directory contains only the output from build_static.py.
root /var/www/chibi-studio/current;
index index.html;
autoindex off;
sendfile on;
server_tokens off;

location = /chibi {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}

location = /api/chibi-models {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}

# Versioned files are retained across releases for visitors with an open tab.
location /assets/ {
    root /var/www/chibi-studio/shared;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location /chibi-models/ {
    root /var/www/chibi-studio/shared;
    gzip_static on;
    gzip_vary on;
    types { }
    default_type model/gltf-binary;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}
